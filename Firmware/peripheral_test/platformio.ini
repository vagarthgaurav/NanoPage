; NanoPage peripheral bring-up test.
;
; Flashed over the Adafruit UF2 bootloader that already lives on the board
; (see docs/bootloader.md): double-tap reset to drop into NPAGEBOOT, then
; `pio run -t upload`. Open the serial monitor afterwards to watch the
; readings.

[env:nanopage]
platform = nordicnrf52
board = nanopage
framework = arduino

monitor_speed = 115200

; GDEY029T94 (128x296, SSD1680) e-paper panel. Pulls in Adafruit_GFX and
; Adafruit_BusIO transitively.
; U8g2_for_Adafruit_GFX adds u8g2's font set on top of GxEPD2's Adafruit_GFX
; drawing surface - used by burn_test_main.cpp's status screen.
; SdFat (Adafruit fork) for the microSD card, shared SPI bus with the panel.
lib_deps =
    zinggjm/GxEPD2@^1.6.9
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    adafruit/SdFat - Adafruit Fork@^2.2.3
build_src_filter = +<*> -<burn_test_main.cpp>

; Accelerated discharge for MAX17055 fuel-gauge calibration - hammers the SD
; card and e-paper panel non-stop instead of sleeping. See burn_test_main.cpp.
; Uses the Display/FuelGauge classes from nanopage-firmware (copied here, not
; shared - keep them in sync manually if either changes).
[env:nanopage_burntest]
extends = env:nanopage
build_src_filter = +<*> -<main.cpp>
