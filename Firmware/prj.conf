# First bring-up: verify the board boots and the RTT console works.

# Buttons (gpio-keys, INPUT_GPIO_KEYS) and RTC (PCF85063, RTC_PCF85063A)
CONFIG_INPUT=y
CONFIG_RTC=y
CONFIG_RTC_ALARM=y

# E-paper panel (SSD1680 over MIPI DBI Mode C / SPI)
CONFIG_DISPLAY=y

# Text-grid UI layer (text.c). Pulls in only the CFB subsystem's built-in
# font tables (subsys/fb/cfb_fonts.c) - text.c reads those directly and
# does not use the rest of the CFB API (see the comment at the top of
# text.c for why).
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y

# k_malloc() pool: display.c's full-frame scratch buffer (296x128/8 = 4736
# bytes) + text.c's persistent framebuffer (another 4736 bytes) + small
# per-row scratch buffers text.c allocates during app_text_flush().
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Logging subsystem, so driver-level LOG_ERR (SSD16XX/MIPI_DBI probe
# failures) actually shows up - without this LOG_* calls are compiled
# out and only our own printk lines are visible. Shares RTT buffer 0
# with the printk console (LOG_BACKEND_RTT_FORCE_PRINTK handles the
# two not corrupting each other).
CONFIG_LOG=y

# Fuel gauge (MAX17055, fuel_gauge.c/max17055.c). NVS on the "storage"
# flash partition persists learned impedance-track parameters across a
# battery disconnect (STATUS.POR).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# Power states (power.c). System OFF after 30 min idle, GPIO-wake on any
# button - the lowest power state the nRF52840 has.
CONFIG_POWEROFF=y

# Without this, Zephyr's regulator-fixed driver never runs, so
# regulator_sdhc's "regulator-boot-off" in nanopage.dts is a no-op: the
# TPS22929D's ON pin (P1.11) is left as a floating GPIO input instead of
# being actively driven low. The TPS22929D datasheet says explicitly not
# to leave that pin floating, so this is worth doing regardless - but it
# is NOT the source of the ~1-2.5mA idle drain under investigation:
# "removing the microSD card" was one of the variables ruled out during
# that testing (see .claude/CLAUDE.md's "Open investigation, unresolved"
# note), and this Kconfig was already enabled at the time. This makes
# regulator-boot-off actually take effect.
#
# Confirmed by isolation testing (2026-09-11): with a microSD card
# physically inserted, enabling this broke display refreshes (BUSY
# cleared in ~20ms instead of the normal ~1.7s, no visible update) -
# almost certainly the card partially powering up on the same shared
# SPI3 bus (separate CS lines, but same MOSI/MISO/SCK) as the display.
# Works correctly with the card removed. Nothing in this firmware uses
# the SD card yet (no filesystem driver wired up), so this isn't a
# regression for anything actually working today - but it means SD
# card init (when that's eventually built) needs to sequence around
# this, not just flip the switch and go.
CONFIG_REGULATOR=y

# CONFIG_PM_DEVICE gates pm_device_action_run() existing at all (needed by
# display.c's manual spi3 resume/suspend around app_display_lock()/
# unlock() - see the comment there). CONFIG_PM_DEVICE_RUNTIME/
# CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE were tried first (automatic
# get/put refcounting instead of an explicit call) but never actually
# worked: SPIM3->ENABLE read back 0 as expected, yet idle current stayed
# at the same elevated level as if it were still clocked - a genuine,
# never-root-caused inconsistency in Zephyr's runtime PM layer for this
# driver (see .claude/CLAUDE.md's "PPK2" investigation). Testing an
# explicit pm_device_action_run() instead, 2026-09-17.
CONFIG_PM_DEVICE=y

# microSD card (sd.c) - FAT filesystem over the zephyr,sdhc-spi-slot ->
# SD subsystem -> zephyr,sdmmc-disk chain wired up on spi3 in
# nanopage.dts. DISK_ACCESS/SDHC/SD_STACK/SPI_SDHC/DISK_DRIVER_SDMMC all
# default to y once those devicetree nodes exist, so only the
# filesystem layer needs to be requested explicitly here.
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Real folder/file names on a card written by anything other than this
# firmware are almost always >8.3 - without this they'd come back
# truncated (e.g. "MYBOOK~1"). Heap mode since prj.conf already sizes a
# heap for display.c/text.c's frame buffers; the LFN working buffer
# (256 * 2 = 512 bytes) is only allocated transiently during a
# fs_readdir() call, not held permanently.
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
# FS_FATFS_MOUNT_MKFS defaults off unless FILE_SYSTEM_MKFS is set, which
# it isn't here - deliberately: a blank/unrecognized card should fail
# fs_mount() loudly, not get silently reformatted and lose whatever was
# on it.

# main()/init ran on the default 1024-byte CONFIG_MAIN_STACK_SIZE fine
# until app_sd_init() was added - fs_mount()'s FAT/SDHC-SPI path (ff.c's
# f_mount plus sdhc_spi.c's own local command buffers) blew straight
# through it into an MPU stacking fault the moment it was called.
# Zephyr's own samples/subsys/fs/fs_sample hits the same thing and sets
# this same value for the same reason.
CONFIG_MAIN_STACK_SIZE=2048

# browser.c (src/ui/browser.c) calls fs_opendir()/fs_readdir() - the same
# FATFS call chain that forced CONFIG_MAIN_STACK_SIZE up above - but now
# from a button press. That callback (buttons.c's button_event_cb) runs
# on Zephyr's dedicated input-processing thread (CONFIG_INPUT_MODE_THREAD,
# the default - see subsys/input/Kconfig), NOT the system workqueue:
# gpio-keys debounces on its own k_work, then posts through
# input_report_key(), which this separate thread dequeues and dispatches
# to INPUT_CALLBACK_DEFINE listeners synchronously. Its default stack
# (CONFIG_INPUT_THREAD_STACK_SIZE, 1024B) is smaller than what fs_mount()
# alone needed on main() - bumped here for the same reason, with the same
# margin.
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# Generic headroom bump for the same reason as CONFIG_MAIN_STACK_SIZE
# above - this thread carries the header/footer/display-refresh work
# (main.c's footer_sample_work/footer_draw_work chain, the RTC alarm and
# charger STAT callbacks) and doesn't need FS-call-chain depth itself,
# but costs nothing to give real margin against the default 1024B.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# USB Mass Storage (usb_msc.c) - exposes the microSD card as a USB drive
# while a host is connected. CONFIG_USB_DEVICE_STACK_NEXT is Zephyr's
# newer USBD stack (the old CONFIG_USB_DEVICE_STACK is legacy/deprecated
# upstream) - matches the in-tree samples/subsys/usb/mass sample, which
# has its own sample.usbd.mass_sdhc_fatfs config for exactly this
# SD-card-over-SPI case. CONFIG_USBD_MSC_LUNS_PER_INSTANCE defaults to 1,
# which is all this board needs (one LUN, the SD card).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y

# Default (512B = one sector) forces every multi-sector SCSI READ(10)/
# WRITE(10) into a stream of individual single-block SD commands (CMD17/
# CMD24) instead of one batched multi-block transfer (CMD18/CMD25) -
# subsys/sd/sd_ops.c's card_read()/card_write() already pick the
# multi-block opcode whenever asked for more than one sector at once, so
# this is purely about giving usbd_msc_scsi.c's internal buffer room to
# actually ask for more than one - 16 sectors/8KB per buffer (x2 for
# CONFIG_USBD_MSC_DOUBLE_BUFFERING = 16KB total), cheap against a 256KB
# RAM budget currently at ~21% used.
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=8192

# Chasing a real UX bug, 2026-09-18: if the USB cable is pulled mid-
# transfer instead of ejected cleanly, the *next* connection took ~20s
# before working. Root cause: Zephyr's SD stack (subsys/sd/sd_ops.c)
# defaults CONFIG_SD_DATA_TIMEOUT to 10000ms and CONFIG_SD_DATA_RETRIES
# to 3 - when the cable drops mid-read/write, the usbd_msc thread is
# left blocked deep inside that read/write, holding the card's own
# internal mutex (card->lock), retrying against now-unpowered hardware
# it has no way to know is gone. There's no Zephyr API to cancel that in
# flight, so it has to run its own timeout/retry cycle to completion
# (up to 10s x 3 = 30s worst case) before releasing the lock - and the
# *next* connection's own disk_access_init() blocks on that same mutex
# in the meantime. 10s x 3 retries is generous margin for a card doing
# real internal housekeeping; this card's actual reads/writes complete
# in low tens of milliseconds even at the old conservative 4MHz clock
# (see sdhc0 in nanopage.dts), so tightening these bounds the worst case
# to ~4s instead of ~30s without meaningfully risking a legitimate
# operation on this specific card/use case.
CONFIG_SD_DATA_TIMEOUT=2000
CONFIG_SD_DATA_RETRIES=1

# USBD_MSC_CLASS's own thread does raw disk_access_read()/write() against
# the same SDHC-over-SPI call chain (sdhc_spi.c) that forced
# CONFIG_MAIN_STACK_SIZE/CONFIG_INPUT_THREAD_STACK_SIZE up above for
# fs_mount()/fs_readdir() - its 1024B default is smaller than what that
# chain needed there, bumped here for the same reason with the same
# margin rather than waiting to hit an MPU stacking fault on real
# hardware.
CONFIG_USBD_MSC_STACK_SIZE=4096
