; NanoPage main firmware.
;
; Flashed over the Adafruit UF2 bootloader that already lives on the board
; (see ../docs/bootloader.md): double-tap reset to drop into NPAGEBOOT, then
; `pio run -t upload`. Open the serial monitor afterwards to watch the
; readings.

[env:nanopage]
platform = nordicnrf52
board = nanopage
framework = arduino

monitor_speed = 115200
